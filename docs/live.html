<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Contract DB — live feed</title>
<style>
  :root { --bg:#0f1016; --panel:#171924; --ink:#dbe2ea; --dim:#7d8592; --line:#262a38; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { position:sticky; top:0; display:flex; gap:12px; align-items:center; padding:10px 16px;
           background:rgba(15,16,22,.92); border-bottom:1px solid var(--line); z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #state { color:var(--dim); font-size:12px; }
  #conn { margin-left:auto; color:var(--dim); font-size:12px; }
  label { color:var(--dim); font-size:12px; display:flex; gap:6px; align-items:center; }
  #feed { padding:12px 16px; list-style:none; margin:0; }
  #feed li { display:grid; grid-template-columns:112px 150px 1fr; gap:10px; padding:3px 0;
             border-bottom:1px solid rgba(38,42,56,.5); align-items:baseline; }
  .at { color:var(--dim); font-size:12px; }
  .kind { font-size:12px; font-weight:700; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; }
  .d { color:var(--ink); overflow-wrap:anywhere; }
  .k-fetched      .kind,.k-destroyed-stub .kind { color:#8ab4ff; }
  .k-gap          .kind { color:#ffb454; }
  .k-uploaded     .kind { color:#7fd67f; }
  .k-upload-failed .kind,.k-fetch-failed .kind { color:#ff7b72; }
  .k-dropped-local-pdf .kind,.k-missing-home .kind { color:#c8b4ff; }
  .k-qc .kind { color:#79c0ff; }
  .k-verdict .kind { color:#a5d6ff; }
  .k-falsify-run .kind,.k-legislation .kind { color:#ffa28b; }
  .empty { color:var(--dim); padding:32px; text-align:center; }
  #autoscroll { accent-color:#7fd67f; }
</style>
</head>
<body>
<header>
  <h1>Metro Contract DB · live feed</h1>
  <span id="state">connecting…</span>
  <label><input type="checkbox" id="autoscroll" checked> autoscroll</label>
  <span id="conn"></span>
</header>
<ul id="feed"><li class="empty">waiting for events…</li></ul>
<script>
  const feedEl = document.getElementById('feed');
  const stateEl = document.getElementById('state');
  const connEl = document.getElementById('conn');
  const autoscroll = document.getElementById('autoscroll');

  // Same-origin /live/stream on the public vhost; override with ?feed= for
  // tunnel previews (e.g. ?feed=http://localhost:8099/stream).
  const feedUrl = new URLSearchParams(location.search).get('feed') || '/live/stream';

  const KIND_COLOR = {
    fetched:'contract fetched', gap:'enumeration gap', uploaded:'uploaded → archive.org',
    'dropped-local-pdf':'local pdf dropped', 'upload-failed':'upload failed',
    'fetch-failed':'fetch failed', 'missing-home':'no durable home',
    'destroyed-stub':'records-destruction stub', qc:'qc', verdict:'completeness verdict',
    'falsify-run':'falsify run', legislation:'legislation change'
  };
  function esc(s){ return String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
  function localTime(iso){
    const d = new Date(iso);
    const p = n => String(n).padStart(2,'0');
    return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  function add(ev){
    const li = document.createElement('li');
    li.className = 'k-' + ev.kind;
    const label = KIND_COLOR[ev.kind] || ev.kind;
    const {at, kind, ...rest} = ev;
    li.innerHTML = `<span class="at">${localTime(at)}</span>
                    <span class="kind">${esc(label)}</span>
                    <span class="d">${esc(JSON.stringify(rest))}</span>`;
    const first = feedEl.firstElementChild;
    if (first && first.classList.contains('empty')) first.remove();
    feedEl.prepend(li);
    while (feedEl.children.length > 400) feedEl.lastElementChild.remove();
    if (autoscroll.checked) window.scrollTo(0, 0);
    return li;
  }

  let count = 0;
  function connect(){
    connEl.textContent = feedUrl + ' — ' + (count ? `${count} events, ` : '') + 'connected';
    const es = new EventSource(feedUrl);
    es.onopen = () => { stateEl.textContent = 'live'; };
    es.onerror = () => { stateEl.textContent = 'reconnecting…'; setTimeout(() => { try{es.close()}catch(e){}; connect(); }, 2000); };
    es.addEventListener('ready', () => { stateEl.textContent = 'streaming (backlog shown)'; });
    es.onmessage = e => { count++; add(JSON.parse(e.data)); };
  }
  connect();
</script>
</body>
</html>
