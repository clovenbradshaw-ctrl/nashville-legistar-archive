<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>County Scoreboard</title>
<style>
  :root { --bg:#fff; --panel:#f5f6f8; --ink:#14171f; --dim:#5b6475; --line:#dfe3ea; --accent:#2457d6;
          --pass:#1a7f46; --fail:#b3261e; --pend:#8a6d00; --pass-bg:#e3f4ea; --fail-bg:#fbe6e4; --pend-bg:#fbf1d0; --flash:#fff6c2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0d12; --panel:#151824; --ink:#e2e8f0; --dim:#8a93a6; --line:#232a3b; --accent:#60a5fa;
            --pass:#4ade80; --fail:#f87171; --pend:#fbbf24; --pass-bg:#0f2a1b; --fail-bg:#33161a; --pend-bg:#2f2706; --flash:#3a3410; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:0 max(14px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px, env(safe-area-inset-left)); }
  main { max-width:900px; margin:0 auto; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0 8px; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0 0 4px; font-weight:650; }
  #totals { color:var(--dim); font-size:13px; }
  #live { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--pend); margin-right:6px; }
  #live.on { background:var(--pass); }
  .controls { display:flex; gap:8px; margin-top:8px; }
  input[type=search], select { font:inherit; font-size:16px; min-height:44px; padding:0 12px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel); color:var(--ink); min-width:0; }
  input[type=search] { flex:1 1 auto; }
  select { flex:0 0 40%; }
  ul { list-style:none; margin:0; padding:0; }
  li.county { border-bottom:1px solid var(--line); content-visibility:auto; contain-intrinsic-size:auto 120px; }
  li.county.flash { animation:flash 2.5s ease-out; }
  @keyframes flash { from { background:var(--flash); } to { background:transparent; } }
  @media (prefers-reduced-motion: reduce) { li.county.flash { animation:none; } }
  .row { display:flex; align-items:center; gap:10px; width:100%; min-height:56px; padding:8px 2px; background:none; border:0; color:inherit;
         font:inherit; text-align:left; cursor:pointer; }
  .name { flex:1 1 auto; min-width:0; font-weight:600; overflow-wrap:anywhere; }
  .name small { display:block; color:var(--dim); font-weight:400; font-size:12px; }
  .count { text-align:right; font-variant-numeric:tabular-nums; }
  .count b { display:block; }
  .count small { color:var(--dim); font-size:12px; }
  .dots { display:flex; gap:4px; }
  .dot { width:14px; height:14px; border-radius:4px; }
  .dot.PASS { background:var(--pass); } .dot.FAIL { background:var(--fail); } .dot.PENDING { background:var(--pend); opacity:.6; }
  .detail { padding:0 2px 12px; }
  .claim { display:flex; gap:8px; padding:6px 0; font-size:14px; }
  .v { flex:0 0 auto; width:68px; text-align:center; border-radius:6px; font-size:12px; font-weight:700; padding:2px 0; align-self:flex-start; }
  .v.PASS { color:var(--pass); background:var(--pass-bg); } .v.FAIL { color:var(--fail); background:var(--fail-bg); } .v.PENDING { color:var(--pend); background:var(--pend-bg); }
  .claim span { overflow-wrap:anywhere; }
  .claim em { display:block; color:var(--dim); font-style:normal; font-size:13px; }
  .leg { margin-top:6px; font-size:14px; }
  .leg a { display:block; color:var(--accent); min-height:44px; padding:10px 0; overflow-wrap:anywhere; }
  .leg small { color:var(--dim); }
  .empty { color:var(--dim); padding:24px 0; }
</style>
</head>
<body>
<main>
<header>
  <h1>County scoreboard</h1>
  <div id="totals"><span id="live"></span><span id="totalsText">loading…</span></div>
  <div class="controls">
    <input id="q" type="search" placeholder="Find a county" aria-label="Find a county" autocomplete="off">
    <select id="sort" aria-label="Sort">
      <option value="docs">Most documents</option>
      <option value="recent">Most recent change</option>
      <option value="fail">Most failing claims</option>
      <option value="name">Name</option>
    </select>
  </div>
</header>
<ul id="list"></ul>
<p id="empty" class="empty" hidden>No counties match.</p>
</main>
<script>
(() => {
  const API = (new URLSearchParams(location.search).get('api') || 'api').replace(/\/$/, '');
  const $ = (id) => document.getElementById(id);
  let board = null, prevDocs = new Map(), open = new Set();

  const ago = (iso) => {
    if (!iso) return 'never';
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 90) return Math.round(s) + 's ago';
    if (s < 5400) return Math.round(s / 60) + ' min ago';
    if (s < 129600) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' d ago';
  };
  const mb = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B');

  function detail(c) {
    const d = document.createElement('div');
    d.className = 'detail';
    c.claims.forEach((x) => {
      const r = document.createElement('div'); r.className = 'claim';
      const v = document.createElement('div'); v.className = 'v ' + x.verdict; v.textContent = x.verdict;
      const t = document.createElement('span'); t.textContent = x.claim;
      const e = document.createElement('em'); e.textContent = x.evidence;
      t.append(e); r.append(v, t); d.append(r);
    });
    const leg = document.createElement('div'); leg.className = 'leg';
    if (!c.legislation.pages.length) {
      leg.textContent = 'No legislation page is being watched for this county yet.';
    } else {
      c.legislation.pages.forEach((p) => {
        const a = document.createElement('a');
        a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = p.url.replace(/^https?:\/\//, '') + ' ↗';
        const s = document.createElement('small');
        s.textContent = `${p.status === 'ok' ? (p.n_links ?? 0) + ' documents listed' : p.status} · checked ${ago(p.checked_at)}` +
          (p.last_change_at ? ` · changed ${ago(p.last_change_at)}` : '') + (p.added_since_watching ? ` · +${p.added_since_watching} since we started watching` : '');
        const w = document.createElement('div'); w.append(a, s); leg.append(w);
      });
    }
    d.append(leg);
    return d;
  }

  function render() {
    if (!board) return;
    const q = $('q').value.trim().toLowerCase();
    let cs = board.counties.filter((c) => !q || c.county.toLowerCase().includes(q) || c.fips.includes(q));
    const key = $('sort').value;
    cs = [...cs].sort((a, b) => key === 'name' ? a.county.localeCompare(b.county)
      : key === 'fail' ? (b.score.fail - a.score.fail) || (b.documents - a.documents)
      : key === 'recent' ? (b.legislation.last_change_at || '').localeCompare(a.legislation.last_change_at || '') || (b.documents - a.documents)
      : (b.documents - a.documents) || a.county.localeCompare(b.county));
    const list = $('list');
    const frag = document.createDocumentFragment();
    cs.forEach((c) => {
      const li = document.createElement('li'); li.className = 'county'; li.dataset.fips = c.fips;
      const was = prevDocs.get(c.fips);
      if (was !== undefined && c.documents > was) li.classList.add('flash');
      const b = document.createElement('button'); b.className = 'row'; b.type = 'button';
      b.setAttribute('aria-expanded', open.has(c.fips));
      const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = c.county;
      const sm = document.createElement('small');
      sm.textContent = `${c.source_tier || 'not probed'} · last fetch ${ago(c.last_fetch)}`; nm.append(sm);
      const ct = document.createElement('div'); ct.className = 'count';
      const bb = document.createElement('b'); bb.textContent = c.documents.toLocaleString();
      const s2 = document.createElement('small'); s2.textContent = c.documents ? mb(c.bytes) : (c.legislation.links_visible ? c.legislation.links_visible + ' listed' : '—');
      ct.append(bb, s2);
      const dots = document.createElement('div'); dots.className = 'dots'; dots.setAttribute('aria-label', `${c.score.pass} pass, ${c.score.fail} fail, ${c.score.pending} pending`);
      c.claims.forEach((x) => { const d = document.createElement('span'); d.className = 'dot ' + x.verdict; d.title = x.claim; dots.append(d); });
      b.append(nm, ct, dots);
      b.addEventListener('click', () => {
        if (open.has(c.fips)) open.delete(c.fips); else open.add(c.fips);
        render();
      });
      li.append(b);
      if (open.has(c.fips)) li.append(detail(c));
      frag.append(li);
    });
    list.replaceChildren(frag);
    $('empty').hidden = cs.length > 0;
    board.counties.forEach((c) => prevDocs.set(c.fips, c.documents));
    const t = board.totals;
    $('totalsText').textContent = `${t.documents.toLocaleString()} documents · ${t.counties_with_documents} of ${t.counties} counties · ` +
      `${t.claims_pass} pass / ${t.claims_fail} fail / ${t.claims_pending} pending · built ${ago(board.built_at)}`;
  }

  function take(json) { board = json; render(); }

  let es = null, poll = null;
  function connect() {
    try {
      es = new EventSource(`${API}/scoreboard/stream`);
      es.onopen = () => $('live').classList.add('on');
      es.onmessage = (e) => { try { take(JSON.parse(e.data)); } catch (_) {} };
      es.onerror = () => { $('live').classList.remove('on'); if (!poll) poll = setInterval(fetchOnce, 15000); };
    } catch (_) { poll = setInterval(fetchOnce, 15000); }
  }
  function fetchOnce() {
    fetch(`${API}/scoreboard`).then((r) => r.json()).then(take).catch(() => { $('totalsText').textContent = 'The scoreboard service is not reachable.'; });
  }
  $('q').addEventListener('input', render);
  $('sort').addEventListener('change', render);
  setInterval(render, 30000);     // keep "x min ago" honest between updates
  fetchOnce();
  connect();
})();
</script>
</body>
</html>
