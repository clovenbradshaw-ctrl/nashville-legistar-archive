<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Contract DB — audit dashboard</title>
<style>
  :root { --bg:#0c0d12; --panel:#151824; --ink:#e2e8f0; --dim:#8a93a6; --line:#232a3b;
          --green:#4ade80; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa; --violet:#c084fc; --teal:#2dd4bf; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:9; display:flex; align-items:center; gap:16px; padding:14px 20px;
           background:rgba(12,13,18,.94); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  header .meta { color:var(--dim); font-size:12px; margin-left:auto; }
  a { color:var(--blue); text-decoration:none; }
  main { padding:18px 20px 40px; max-width:1280px; margin:0 auto; }
  .now { background:linear-gradient(180deg,rgba(60,80,120,.14),transparent); border:1px solid var(--line); border-radius:12px;
         padding:14px 18px; margin-bottom:18px; }
  .now h2 { margin:0 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .now p { margin:3px 0; }
  .grid { display:grid; gap:12px; margin-bottom:18px; }
  .stats { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat .n { font-size:26px; font-weight:700; line-height:1.1; }
  .stat .l { color:var(--dim); font-size:12px; margin-top:2px; }
  .cols { grid-template-columns:2fr 1fr; }
  @media (max-width:900px){ .cols{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .kv { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px solid rgba(35,42,59,.6); font-size:13px; }
  .kv .k { color:var(--dim); }
  .bar { height:6px; border-radius:3px; background:#222a3c; overflow:hidden; margin:3px 0 8px; }
  .bar i { display:block; height:100%; background:var(--blue); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .g-green{ background:rgba(74,222,128,.14); color:var(--green);} .g-red{ background:rgba(248,113,113,.14); color:var(--red);}
  .g-amber{ background:rgba(251,191,36,.14); color:var(--amber);} .g-gray{ background:rgba(138,147,166,.14); color:var(--dim);}
  .g-violet{ background:rgba(192,132,252,.14); color:var(--violet);}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid rgba(35,42,59,.6); }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .chiprow { display:flex; gap:6px; flex-wrap:wrap; }
  ul.feed { list-style:none; margin:0; padding:0; max-height:420px; overflow:auto; }
  ul.feed li { padding:4px 2px; border-bottom:1px solid rgba(35,42,59,.5); font-size:12.5px; }
  ul.feed .time { color:var(--dim); font-size:11px; margin-right:8px; }
  .foot { color:var(--dim); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<header>
  <h1>Metro Contract DB — audit dashboard</h1>
  <span>small files → GitHub · originals → archive.org · <a href="live.html">live feed</a></span>
  <span class="meta" id="meta">loading…</span>
</header>
<main>
  <section class="now" id="now"><h2>What's going on</h2><p class="dim">waiting…</p></section>

  <section class="grid stats" id="stats"></section>

  <section class="grid cols">
    <div class="card"><h3>Roundups — contracts by period</h3><div id="roundups"></div></div>
    <div class="card"><h3>Missing (recount estimate)</h3><div id="missing"></div></div>
  </section>

  <section class="grid cols">
    <div class="card"><h3>Completeness verdicts</h3><div id="verdicts"></div></div>
    <div class="card"><h3>Quality control</h3><div id="qc"></div></div>
  </section>

  <div class="card"><h3>Recent activity</h3><ul class="feed" id="feed"><li class="dim">waiting…</li></ul></div>

  <div class="foot" id="foot">…</div>
</main>

<script>
  const RAW = (new URLSearchParams(location.search).get('raw') ||
               'https://raw.githubusercontent.com/clovenbradshaw-ctrl/nashville-legistar-archive/main').replace(/\/$/,'');
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const cap = s => String(s ?? '').slice(0, 120);
  const pct = (n,d) => d ? Math.round(100*n/d) + '%' : '—';

  // every kind a badge class/face
  const STANDING = { complete:['g-green','complete'], incomplete:['g-red','incomplete'],
                     contested:['g-amber','contested'], unexamined:['g-gray','not examined'] };

  function summarize(ev){
    const t = (d)=>`<span class="time">${d.slice(11,19)}</span>`;
    switch (ev.kind){
      case 'fetched': return t(ev.at)+`Pulled <b>${esc(ev.contract_number||ev.epav_token)}</b>${ev.department?` — ${esc(ev.department).toLowerCase()}`:''}: PDF + text + read staged, awaiting upload.`;
      case 'destroyed-stub': return t(ev.at)+`<b>${esc(ev.contract_number||ev.epav_token)}</b> is a records-destruction stub (GRS 102) — kept as the record of its destruction.`;
      case 'gap': return t(ev.at)+`<span class="g-amber badge">gap</span> a search shard for ${esc(ev.subject||'?')} is still capped at 1000 rows — surfaced, never hidden.`;
      case 'uploaded': return t(ev.at)+`<span class="g-green badge">archived</span> ${esc(ev.contract_number||ev.epav_token)} → archive.org.`;
      case 'dropped-local-pdf': return t(ev.at)+`Local copy of ${esc(ev.epav_token||'')} deleted after archive.org confirmed it.`;
      case 'upload-failed': return t(ev.at)+`<span class="g-red badge">upload failed</span> ${esc(ev.epav_token)}: ${esc(cap(ev.error))} — queued, retried.`;
      case 'fetch-failed': return t(ev.at)+`<span class="g-red badge">fetch failed</span> ${esc(cap(ev.error))} — retried by enumeration.`;
      case 'missing-home': return t(ev.at)+`<span class="g-red badge">no durable home</span> ${esc(ev.epav_token)}: neither uploaded nor local — surfaced to QC.`;
      case 'qc': return t(ev.at)+`<span class="g-amber badge">qc ${esc(ev.grade)}</span> on ${esc(ev.check)} (${esc(ev.subject)}).`;
      case 'qc-run': return t(ev.at)+`QC run: ${ev.checks} checks, <span class=${ev.defects?'"g-red badge"':'"g-green badge"'}>${ev.defects} defect${ev.defects==1?'':'s'}</span>, ${ev.suspicious} suspicious.`;
      case 'verdict':
        if (ev.standing==='unexamined'){ if(ev.subject==='MULTIPLE') return t(ev.at)+`${ev.n_unexamined||ev.departments?.length||'Some'} department(s) not examined yet — nothing pulled, not counted complete.`;
          return t(ev.at)+`${esc(ev.subject)} not examined yet — nothing pulled from it.`; }
        const b=STANDING[ev.standing]||['g-gray',ev.standing];
        return t(ev.at)+`<span class="badge ${b[0]}">${b[1]}</span> ${esc(ev.subject)}: ${esc(cap(ev.reason))}.`;
      case 'falsify-run': return t(ev.at)+`Falsification round: ${['complete','incomplete','contested','unexamined'].map(k=>`${ev[k]??0} ${k}`).join(', ')}.`;
      case 'missing': return t(ev.at)+`Missing check ${esc(ev.department)}: <b>${ev.missing||0}</b> contract(s) the portal still shows we don't hold.`;
      case 'legislation': return t(ev.at)+`Legistar: matter ${esc(ev.matter_file||'')} ${ev.change||'changed'}.`;
      case 'roundup': return t(ev.at)+`<b>Roundup:</b> ${ev.contracts} pulled, ${ev.uploaded} archived in this window.`;
      default: return t(ev.at)+`${esc(ev.kind)}: ${esc(cap(JSON.stringify(ev)))}`;
    }
  }

  function render(s){
    $('meta').textContent = 'updated ' + (s.at||'?') + ' · ' + RAW;
    const st = s.state||{};
    $('now').innerHTML = '<h2>What\'s going on</h2>' + (st.prose||['No snapshot yet']).map(p=>`<p>${esc(p)}</p>`).join('');

    const c = st.counts||{};
    const q = st.qc||{}; const r = st.rules||{};
    $('stats').innerHTML = [
      ['Pulled (all-time)', c.pulled_accounted ?? c.fetched],
      ['Uploaded to archive.org (all-time)', c.uploaded],
      ['Staged now (pending upload)', c.pending],
      ['Small files on GitHub', c.deployed],
      ['Missing (recount)', c.missing_total||0],
      ['Open enumeration gaps', c.gaps, c.gaps?'g-red':'g-green'],
      ['Rules learned', r.adopted], ['Conceded by proteasome', r.conceded]
    ].map(([l,n,b])=>`<div class="stat"><div class="n ${b==='g-red'?'g-red':''}">${n}</div><div class="l">${l}</div></div>`).join('')
      + `<div class="card" style="grid-column:1/-1;font-size:12px;color:var(--dim)">Totals are live and change over time — the crawl discovers and archives more contracts continuously. “All-time” includes the project's earlier sessions' work.</div>`;

    const ps = s.periods||{};
    $('roundups').innerHTML = Object.entries(ps).map(([k,p])=>{
      const deps=Object.entries(p.departments||{}); const max=Math.max(1,...deps.map(([,v])=>v));
      const vendors=Object.entries(p.vendors||{}).slice(0,5);
      return `<div style="margin-bottom:12px">
        <div class="kv"><span class="k">${esc(k)}</span><span><b>${p.contracts}</b> pulled · <b>${p.uploaded}</b> archived</span></div>
        ${deps.slice(0,5).map(([d,n])=>`<div style="margin-top:6px"><div style="font-size:12px">${esc(d).toLowerCase()} — ${n}</div>
          <div class="bar"><i style="width:${Math.round(100*n/max)}%"></i></div></div>`).join('')}
        <div style="font-size:11.5px;color:var(--dim)">vendors: ${vendors.map(([v,n])=>`${esc(v).toLowerCase()} (${n})`).join(' · ')}</div>
      </div>`;
    }).join('');

    const md = st.missing||{};
    const tops = md.top_departments||[];
    $('missing').innerHTML = tops.length
      ? `<table><tr><th>Department</th><th>missing</th><th>standing</th></tr>` +
        tops.map(r=>`<tr><td>${esc(r.department)}</td><td><b>${r.missing}</b></td><td>${(STANDING[r.standing]?`<span class="badge ${STANDING[r.standing][0]}">${STANDING[r.standing][1]}</span>`:esc(r.standing))}</td></tr>`).join('') +
        `</table><div style="color:var(--dim);font-size:12px;margin-top:8px">${md.missing_total??'?'} total still shown by the portal that we don't hold.</div>`
      : `<div class="dim">No missing estimate yet — the recount hasn't run on any department.</div>`;

    const vc = st.verdicts||{};
    const vTotal = Object.values(vc).reduce((a,b)=>a+b,0)||0;
    $('verdicts').innerHTML = `<div class="chiprow">` +
      Object.keys(STANDING).map(k=>`<span class="badge ${STANDING[k][0]}">${STANDING[k][1]}: ${vc[k]??0}</span>`).join('') +
      `</div><div style="color:var(--dim);font-size:12px;margin-top:10px">${vTotal} department verdicts on record · unexamined is never a pass.</div>`;

    $('qc').innerHTML = `<div class="kv"><span class="k">reports</span><span>${(q.ok||0)+(q.suspicious||0)+(q.defect||0)||0}</span></div>` +
      `<div class="kv"><span class="k">defects</span><span class="g-red">${q.defect||0}</span></div>` +
      `<div class="kv"><span class="k">suspicious</span><span class="g-amber">${q.suspicious||0}</span></div>` +
      `<div class="kv"><span class="k">clean</span><span class="g-green">${q.ok||0}</span></div>` +
      `<div style="color:var(--dim);font-size:12px;margin-top:10px">every check carries a falsifying control — <a href="https://github.com/clovenbradshaw-ctrl/nashville-legistar-archive/blob/main/scripts/qc_falsify.py">proven here</a>.</div>`;

    const feed = s.recent||[];
    $('feed').innerHTML = feed.slice().reverse().map(ev=>`<li>${summarize(ev)}</li>`).join('') || '<li class="dim">no recent events yet</li>';
    $('foot').textContent = `sources: ${RAW}/data/live/summary.json (polled 30s) · ${esc(s.at||'')}`;
  }

  async function load(){
    try{ const r = await fetch(RAW + '/data/live/summary.json'); const s = await r.json(); if (s.recent) s.recent = s.recent.filter(ev=>!['snapshot'].includes(ev.kind)); render(s); }
    catch(e){ $('meta').textContent = 'fetch failed — retrying in 30s (make sure the pipeline roundup has pushed summary.json)'; }
  }
  load(); setInterval(load, 30000);
</script>
</body>
</html>
